<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating</title>
</head>
<body>
    <h1>Book name: {{ book.title }}</h1>
    <p>Current Rating: {{ book.rating }}</p>

    <form action="{{ url_for('edit_rating', id=book.id) }}" method="POST">
        <input type="text" name="new_rating" placeholder="Enter new rating (e.g. 9.5)" required>
        <button type="submit">Change Rating</button>
    </form>
</body>
</html>
