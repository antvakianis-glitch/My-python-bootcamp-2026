<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Antonios | Python Web Developer{% endblock %}</title>
    <meta name="description" content="Portfolio of Antonis, a Python web developer building Flask applications.">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- favicon -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Antonis</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#about">About</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#projects">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#contact">Contact</a></li>
            </ul>
        </div>
    </div>
    </nav>

    <!-- Content Block -->
    <main class="container my-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 border-top border-secondary">
        <div class="container">
            <p class="mb-1">&copy; 2026 Antonios. Built with Flask &amp; Bootstrap 5.</p>
            <p class="small mb-0">
                <a href="https://github.com/antvakianis-glitch" target="_blank" rel="noopener" class="text-white text-decoration-none me-3">GitHub</a>
                <a href="{{ url_for('home') }}#contact" class="text-white text-decoration-none">Contact</a>
            </p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
